<circle cx="997.5" cy="122.0" r="5.6" fill="#1F5C2E" stroke="white" stroke-width="1.6"/>
<line x1="997.5" y1="122.0" x2="997.5" y2="246.5" stroke="#9AA0A6" stroke-width="1"/>
<text x="991.5" y="258.5" text-anchor="end" font-size="11" font-weight="bold" fill="#1F5C2E">Managalas CA · 2017 · 214,696 ha</text>
<text x="991.5" y="273.5" text-anchor="end" font-size="10" fill="#666">added here — omitted from the Act’s register in error (acknowledged by CEPA)</text>
<text x="110.83333333333333" y="135" font-size="11.5" fill="#4A5B6B">Most of the register was gazetted during</text>
<text x="110.83333333333333" y="152" font-size="11.5" fill="#4A5B6B">Waves 2–3 — imposition and the ICAD era.</text>
<text x="110.83333333333333" y="169" font-size="11.5" fill="#4A5B6B">The consent era has added only a few,</text>
<text x="110.83333333333333" y="186" font-size="11.5" fill="#4A5B6B">among them YUS (2009) and Managalas (2017).</text>
<text x="95" y="465" font-size="11" font-weight="bold" fill="#666">THE WAVES (overlapping, not successive)</text>
<rect x="95.0" y="474" width="1045.0" height="22" rx="5" fill="#F2F2F2" stroke="#9AA0A6" stroke-width="1.5" opacity="0.45"/>
<text x="104.0" y="489" font-size="11" font-weight="bold" fill="#7A7F85">Wave 1 — Circumstance (background, pre-1970 and continuing)</text>
<rect x="253.33333333333334" y="502" width="411.66666666666663" height="22" rx="5" fill="#EEF2F5" stroke="#4A5B6B" stroke-width="1.5"/>
<text x="262.33333333333337" y="517" font-size="11" font-weight="bold" fill="#4A5B6B">Wave 2 — Imposition</text>
<rect x="506.6666666666667" y="530" width="379.99999999999994" height="22" rx="5" fill="#F3EBD2" stroke="#8A6D00" stroke-width="1.5"/>
<text x="515.6666666666667" y="545" font-size="11" font-weight="bold" fill="#8A6D00">Wave 3 — Transaction (ICAD)</text>
<rect x="870.8333333333334" y="558" width="269.16666666666663" height="22" rx="5" fill="#DCEAD9" stroke="#1F5C2E" stroke-width="1.5"/>
<text x="879.8333333333334" y="573" font-size="11" font-weight="bold" fill="#1F5C2E">Wave 4 — Consent</text>
<rect x="1140.0" y="586" width="14.250000000001592" height="22" rx="5" fill="#EAF3E9" stroke="#1F5C2E" stroke-width="1.5" stroke-dasharray="7,5"/>
<text x="1132.0" y="601" text-anchor="end" font-size="11" font-weight="bold" fill="#1F5C2E">Wave 5 — Recognition (proposed)</text>
<line x1="95" y1="610" x2="1140" y2="610" stroke="#E3E7EA"/>
<text x="95" y="624" font-size="9.5" fill="#666">Source: Protected Areas Act 2024, Schedule 2 (Existing Protected Areas), 57 areas. Two corrections from project and CEPA knowledge are applied: the Managalas Conservation</text>
<text x="95" y="639" font-size="9.5" fill="#666">Area (214,696 ha, 2017), omitted from the register in error, is added; and YUS is shown at its original 2009 gazettal (the Act’s 2019 date reflects a later expansion). Of the</text>
<text x="95" y="654" font-size="9.5" fill="#666">resulting 58 areas, 56 carry a date and are plotted; two register entries are undated. More than half are Wildlife Management Areas, and all together they amount to only</text>
<text x="95" y="669" font-size="9.5" fill="#666">about 4% of national land (Melick et al. 2012), against the 30% of Target 3.</text>
</svg>