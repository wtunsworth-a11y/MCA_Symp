<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="726" viewBox="0 0 1160 726" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1160" height="726" fill="white"/>
<text x="580.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F5C2E">The waves of conservation in PNG — and the potential of a fifth</text>
<text x="363.0" y="66" text-anchor="middle" font-size="11" font-weight="bold" fill="#888" letter-spacing="1">THE STARTING POINT</text>
<text x="863.0" y="66" text-anchor="middle" font-size="11" font-weight="bold" fill="#888" letter-spacing="1">THE OUTCOME</text>
<rect x="64" y="92" width="172" height="76" rx="9" ry="9" fill="#9AA0A6"/>
<text x="150.0" y="126.0" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Wave 1</text>
<text x="150.0" y="146.0" text-anchor="middle" font-size="12" fill="white" opacity="0.95">Circumstance</text>
<rect x="258" y="92" width="710" height="76" rx="9" ry="9" fill="#F2F2F2" stroke="#9AA0A6" stroke-width="1.8"/>
<text x="613.0" y="126.0" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7A7F85">Forest kept intact as a by-product of customary life</text>
<text x="613.0" y="145.0" text-anchor="middle" font-size="10.5" fill="#7A7F85">no deliberate conservation process</text>
<rect x="64" y="214" width="172" height="76" rx="9" ry="9" fill="#4A5B6B"/>
<text x="150.0" y="248.0" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Wave 2</text>
<text x="150.0" y="268.0" text-anchor="middle" font-size="12" fill="white" opacity="0.95">Imposition</text>
<rect x="258" y="214" width="210" height="76" rx="9" ry="9" fill="#F3EBD2" stroke="#8A6D00" stroke-width="1.8"/>
<text x="363.0" y="248.0" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#8A6D00">Priority area</text>
<text x="363.0" y="267.0" text-anchor="middle" font-size="10.5" fill="#8A6D00">chosen on a biodiversity map</text>
<line x1="468" y1="252.0" x2="749" y2="252.0" stroke="#666" stroke-width="2.4"/>
<polygon points="758,252.0 747,246.0 747,258.0" fill="#666"/>
<rect x="758" y="214" width="210" height="76" rx="9" ry="9" fill="#EEF2F5" stroke="#4A5B6B" stroke-width="1.8"/>
<text x="863.0" y="248.0" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#4A5B6B">Protected area</text>
<text x="863.0" y="267.0" text-anchor="middle" font-size="10.5" fill="#4A5B6B">declared over the community</text>
<text x="613.0" y="244.0" text-anchor="middle" font-size="10" fill="#b00" font-style="italic">people skipped</text>
<rect x="64" y="336" width="172" height="76" rx="9" ry="9" fill="#4A5B6B"/>
<text x="150.0" y="370.0" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Wave 3</text>
<text x="150.0" y="390.0" text-anchor="middle" font-size="12" fill="white" opacity="0.95">Transaction</text>
<rect x="258" y="336" width="210" height="76" rx="9" ry="9" fill="#F3EBD2" stroke="#8A6D00" stroke-width="1.8"/>
<text x="363.0" y="370.0" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#8A6D00">Priority area</text>
<text x="363.0" y="389.0" text-anchor="middle" font-size="10.5" fill="#8A6D00">chosen on a biodiversity map</text>
<line x1="468" y1="374.0" x2="499" y2="374.0" stroke="#666" stroke-width="2.4"/>
<polygon points="508,374.0 497,368.0 497,380.0" fill="#666"/>
<rect x="508" y="336" width="210" height="76" rx="9" ry="9" fill="#F3EBD2" stroke="#8A6D00" stroke-width="1.8"/>
<text x="613.0" y="370.0" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#8A6D00">Advise / induce people</text>
<text x="613.0" y="389.0" text-anchor="middle" font-size="10.5" fill="#8A6D00">development in exchange</text>
<line x1="718" y1="374.0" x2="749" y2="374.0" stroke="#666" stroke-width="2.4"/>
<polygon points="758,374.0 747,368.0 747,380.0" fill="#666"/>
<rect x="758" y="336" width="210" height="76" rx="9" ry="9" fill="#EEF2F5" stroke="#1F5C2E" stroke-width="1.8"/>
<text x="863.0" y="370.0" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1F5C2E">PA with local benefits</text>
<text x="863.0" y="389.0" text-anchor="middle" font-size="10.5" fill="#1F5C2E">consent purchased</text>
<rect x="64" y="458" width="172" height="76" rx="9" ry="9" fill="#1F5C2E"/>
<text x="150.0" y="492.0" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Wave 4</text>
<text x="150.0" y="512.0" text-anchor="middle" font-size="12" fill="white" opacity="0.95">Consent</text>
<rect x="258" y="458" width="210" height="76" rx="9" ry="9" fill="#DCEAD9" stroke="#1F5C2E" stroke-width="1.8"/>
<text x="363.0" y="492.0" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1F5C2E">People receptive</text>
<text x="363.0" y="511.0" text-anchor="middle" font-size="10.5" fill="#1F5C2E">community&#x27;s own interest</text>
<line x1="468" y1="496.0" x2="499" y2="496.0" stroke="#1F5C2E" stroke-width="2.4"/>
<polygon points="508,496.0 497,490.0 497,502.0" fill="#1F5C2E"/>
<rect x="508" y="458" width="210" height="76" rx="9" ry="9" fill="#DCEAD9" stroke="#1F5C2E" stroke-width="1.8"/>
<text x="613.0" y="492.0" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1F5C2E">Consensus</text>
<text x="613.0" y="511.0" text-anchor="middle" font-size="10.5" fill="#1F5C2E">consent built &amp; kept</text>
<line x1="718" y1="496.0" x2="749" y2="496.0" stroke="#1F5C2E" stroke-width="2.4"/>
<polygon points="758,496.0 747,490.0 747,502.0" fill="#1F5C2E"/>
<rect x="758" y="458" width="210" height="76" rx="9" ry="9" fill="#DCEAD9" stroke="#1F5C2E" stroke-width="1.8"/>
<text x="863.0" y="492.0" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1F5C2E">PA with local management</text>
<text x="863.0" y="511.0" text-anchor="middle" font-size="10.5" fill="#1F5C2E">owned &amp; governed locally</text>
<line x1="44" y1="570" x2="968" y2="570" stroke="#ccc" stroke-width="1" stroke-dasharray="3,4"/>
<text x="258" y="586" font-size="11.5" fill="#1F5C2E" font-style="italic" font-weight="bold">A potential fifth wave — recognising what already works</text>
<rect x="64" y="600" width="172" height="76" rx="9" ry="9" fill="none" stroke="#1F5C2E" stroke-width="2.2" stroke-dasharray="7,5"/>
<text x="150.0" y="634.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F5C2E">Wave 5?</text>
<text x="150.0" y="654.0" text-anchor="middle" font-size="12" fill="#1F5C2E" opacity="0.95">Recognition</text>
<rect x="258" y="600" width="210" height="76" rx="9" ry="9" fill="#EAF3E9" stroke="#1F5C2E" stroke-width="1.8" stroke-dasharray="7,5"/>
<text x="363.0" y="634.0" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1F5C2E">Intact customary land</text>
<text x="363.0" y="653.0" text-anchor="middle" font-size="10.5" fill="#1F5C2E">what the first wave still holds</text>
<line x1="468" y1="638.0" x2="499" y2="638.0" stroke="#1F5C2E" stroke-width="2.4" stroke-dasharray="6,5"/>
<polygon points="508,638.0 497,632.0 497,644.0" fill="#1F5C2E"/>
<rect x="508" y="600" width="210" height="76" rx="9" ry="9" fill="#EAF3E9" stroke="#1F5C2E" stroke-width="1.8" stroke-dasharray="7,5"/>
<text x="613.0" y="634.0" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1F5C2E">Recognise &amp; describe</text>
<text x="613.0" y="653.0" text-anchor="middle" font-size="10.5" fill="#1F5C2E">OECMs, mapping, ICCAs</text>
<line x1="718" y1="638.0" x2="749" y2="638.0" stroke="#1F5C2E" stroke-width="2.4" stroke-dasharray="6,5"/>
<polygon points="758,638.0 747,632.0 747,644.0" fill="#1F5C2E"/>
<rect x="758" y="600" width="210" height="76" rx="9" ry="9" fill="#EAF3E9" stroke="#1F5C2E" stroke-width="1.8" stroke-dasharray="7,5"/>
<text x="863.0" y="634.0" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1F5C2E">Conservation recognised</text>
<text x="863.0" y="653.0" text-anchor="middle" font-size="10.5" fill="#1F5C2E">bounded, governed, counted, owned</text>
<path d="M 60,638.0 C 12,638.0 12,130.0 60,130.0" fill="none" stroke="#1F5C2E" stroke-width="2.4" stroke-dasharray="7,5"/>
<polygon points="60,130.0 49,124.0 49,136.0" fill="#1F5C2E"/>
<text x="22" y="384.0" text-anchor="middle" font-size="11" fill="#1F5C2E" font-style="italic" transform="rotate(-90 22 384.0)">recognising the remaining potential of Wave 1</text>
</svg>